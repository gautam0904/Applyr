name: Build & Release Deploy Package

on:
  push:
    branches: [main]
  workflow_dispatch:       # allows you to trigger manually from GitHub UI

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      # ── 3. Build Backend ──────────────────────────────────────────────
      - name: Install Backend dependencies
        run: npm ci
        working-directory: Backend

      - name: Build Backend (TypeScript → JS)
        run: npm run build
        working-directory: Backend

      - name: Prune Backend devDependencies
        run: npm prune --omit=dev
        working-directory: Backend

      # ── 4. Build Frontend ─────────────────────────────────────────────
      - name: Install Frontend dependencies
        run: npm ci
        working-directory: Frontend

      - name: Build Frontend (Angular SSR)
        run: npm run build
        working-directory: Frontend

      # ── 5. Package deploy artifacts ───────────────────────────────────
      - name: Create deploy package
        run: |
          mkdir -p applyr-deploy/backend
          mkdir -p applyr-deploy/frontend
          mkdir -p applyr-deploy/logs

          # Backend: compiled JS + runtime node_modules only (no .env — secrets stay local)
          cp -r Backend/dist          applyr-deploy/backend/dist
          cp -r Backend/node_modules  applyr-deploy/backend/node_modules
          cp    Backend/package.json  applyr-deploy/backend/package.json
          cp    Backend/.env.example  applyr-deploy/backend/.env.example

          # Frontend: SSR build output only (no node_modules needed)
          cp -r Frontend/dist/Applyr  applyr-deploy/frontend/dist

          # PM2 config + docs (ecosystem uses __dirname — no path patching needed)
          cp ecosystem.config.cjs     applyr-deploy/
          cp README.md                applyr-deploy/

          # ── setup.sh (Mac / Linux) ─────────────────────────────────────
          cat > applyr-deploy/setup.sh << 'SETUP_SH'
          #!/bin/bash
          # Applyr Setup — Mac / Linux
          # Run once after downloading the release zip.
          # Usage: bash setup.sh

          set -e
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          echo ""
          echo "╔══════════════════════════════════════╗"
          echo "║   Applyr — Setup (Mac / Linux)       ║"
          echo "╚══════════════════════════════════════╝"
          echo ""

          # 1. Create .env from example
          if [ ! -f "$DIR/backend/.env" ]; then
            cp "$DIR/backend/.env.example" "$DIR/backend/.env"
            echo "✅ Created backend/.env"
            echo "⚠️  Open backend/.env and fill in your API keys before starting!"
          else
            echo "✅ backend/.env already exists — skipping"
          fi

          # 2. Fix PUPPETEER_CACHE_DIR in .env to this machine's absolute path
          CACHE="$DIR/backend/.cache/puppeteer"
          mkdir -p "$CACHE"
          sed -i.bak "s|PUPPETEER_CACHE_DIR=.*|PUPPETEER_CACHE_DIR=$CACHE|" "$DIR/backend/.env"
          rm -f "$DIR/backend/.env.bak"
          echo "✅ PUPPETEER_CACHE_DIR → $CACHE"

          # 3. Download Puppeteer Chrome if missing
          if [ -z "$(ls -A "$CACHE" 2>/dev/null)" ]; then
            echo "⬇️  Downloading Puppeteer Chrome (this takes ~1 min)..."
            PUPPETEER_CACHE_DIR="$CACHE" npx --prefix "$DIR/backend" puppeteer browsers install chrome
            echo "✅ Puppeteer Chrome downloaded"
          else
            echo "✅ Puppeteer Chrome already cached"
          fi

          # 4. Install PM2 if missing
          if ! command -v pm2 &>/dev/null; then
            echo "⬇️  Installing PM2..."
            npm install -g pm2
            echo "✅ PM2 installed"
          else
            echo "✅ PM2 already installed — $(pm2 --version)"
          fi

          echo ""
          echo "══════════════════════════════════════════"
          echo "  Setup complete!"
          echo ""
          echo "  Next:"
          echo "  1. Edit backend/.env — fill in MONGODB_URI, API keys etc."
          echo "  2. pm2 start ecosystem.config.cjs"
          echo "  3. pm2 save && pm2 startup   ← auto-start on reboot"
          echo ""
          echo "  App → http://localhost:4000"
          echo "  API → http://localhost:3000"
          echo "══════════════════════════════════════════"
          SETUP_SH
          chmod +x applyr-deploy/setup.sh

          # ── setup.ps1 (Windows — PowerShell) ──────────────────────────
          cat > applyr-deploy/setup.ps1 << 'SETUP_PS1'
          # Applyr Setup — Windows (PowerShell)
          # Run once after downloading the release zip.
          # Usage: Right-click → "Run with PowerShell"
          #   or in PowerShell terminal: .\setup.ps1

          $ErrorActionPreference = "Stop"
          $DIR = Split-Path -Parent $MyInvocation.MyCommand.Definition

          Write-Host ""
          Write-Host "╔══════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║   Applyr — Setup (Windows)           ║" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""

          # 1. Create .env from example
          $envFile = "$DIR\backend\.env"
          $envExample = "$DIR\backend\.env.example"
          if (-Not (Test-Path $envFile)) {
            Copy-Item $envExample $envFile
            Write-Host "✅ Created backend\.env" -ForegroundColor Green
            Write-Host "⚠️  Open backend\.env and fill in your API keys before starting!" -ForegroundColor Yellow
          } else {
            Write-Host "✅ backend\.env already exists — skipping" -ForegroundColor Green
          }

          # 2. Fix PUPPETEER_CACHE_DIR in .env
          $cache = "$DIR\backend\.cache\puppeteer"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $envContent = Get-Content $envFile
          $envContent = $envContent -replace "PUPPETEER_CACHE_DIR=.*", "PUPPETEER_CACHE_DIR=$cache"
          Set-Content $envFile $envContent
          Write-Host "✅ PUPPETEER_CACHE_DIR → $cache" -ForegroundColor Green

          # 3. Download Puppeteer Chrome if missing
          $chromeExists = Get-ChildItem $cache -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-Not $chromeExists) {
            Write-Host "⬇️  Downloading Puppeteer Chrome (this takes ~1 min)..." -ForegroundColor Yellow
            $env:PUPPETEER_CACHE_DIR = $cache
            & npx --prefix "$DIR\backend" puppeteer browsers install chrome
            Write-Host "✅ Puppeteer Chrome downloaded" -ForegroundColor Green
          } else {
            Write-Host "✅ Puppeteer Chrome already cached" -ForegroundColor Green
          }

          # 4. Install PM2 if missing
          $pm2Exists = Get-Command pm2 -ErrorAction SilentlyContinue
          if (-Not $pm2Exists) {
            Write-Host "⬇️  Installing PM2..." -ForegroundColor Yellow
            npm install -g pm2
            Write-Host "✅ PM2 installed" -ForegroundColor Green
          } else {
            Write-Host "✅ PM2 already installed" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "══════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "  Setup complete!" -ForegroundColor Green
          Write-Host ""
          Write-Host "  Next steps:"
          Write-Host "  1. Edit backend\.env — fill in MONGODB_URI, API keys etc."
          Write-Host "  2. pm2 start ecosystem.config.cjs"
          Write-Host "  3. pm2 save"
          Write-Host "  4. pm2 startup   then run the command it prints"
          Write-Host ""
          Write-Host "  App → http://localhost:4000"
          Write-Host "  API → http://localhost:3000"
          Write-Host "══════════════════════════════════════════" -ForegroundColor Cyan
          SETUP_PS1

          # Zip it up
          zip -r applyr-deploy.zip applyr-deploy/
          echo "✅ Package created: applyr-deploy.zip ($(du -sh applyr-deploy.zip | cut -f1))"

      # ── 6. Get version info ───────────────────────────────────────────
      - name: Get version info
        id: version
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # ── 7. Create / update GitHub Release ─────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}
          name: "Deploy Package — ${{ steps.version.outputs.date }}"
          body: |
            ## Applyr Deploy Package

            Download `applyr-deploy.zip` — **no source code, no build tools needed on the target machine**.

            ---

            ### 🐧 Linux / 🍎 Mac
            ```bash
            unzip applyr-deploy.zip
            cd applyr-deploy
            bash setup.sh
            nano backend/.env        # fill in MONGODB_URI, API keys
            pm2 start ecosystem.config.cjs
            pm2 save && pm2 startup  # auto-start on boot
            ```

            ### 🪟 Windows (PowerShell)
            ```powershell
            Expand-Archive applyr-deploy.zip
            cd applyr-deploy
            .\setup.ps1              # right-click → Run with PowerShell also works
            notepad backend\.env     # fill in MONGODB_URI, API keys
            pm2 start ecosystem.config.cjs
            pm2 save
            pm2 startup              # run the command it prints
            ```

            ---

            ### What's included
            | File/Folder | Description |
            |---|---|
            | `backend/dist/` | Compiled Express server |
            | `backend/node_modules/` | Runtime packages only (no devDeps) |
            | `backend/.env.example` | API key template |
            | `frontend/dist/` | Angular SSR build |
            | `ecosystem.config.cjs` | PM2 config (cross-platform, no path editing needed) |
            | `setup.sh` | One-command setup for Mac/Linux |
            | `setup.ps1` | One-command setup for Windows |

            > ⚠️ `.env` is **not included** (contains secrets). `setup.sh` / `setup.ps1` creates it from `.env.example` automatically.

            **Commit:** `${{ steps.version.outputs.sha }}`
          files: applyr-deploy.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
