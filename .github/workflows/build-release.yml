name: Build & Release Deploy Package

on:
  push:
    branches: [main]
  workflow_dispatch: # trigger manually from GitHub UI → Actions tab

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create GitHub releases and upload assets

    steps:
      # ── 1. Checkout source ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      # ── 3. Build Backend ──────────────────────────────────────────────
      - name: Install Backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Build Backend (TypeScript to JS)
        working-directory: Backend
        run: npm run build

      # ── 4. Build Frontend ─────────────────────────────────────────────
      - name: Install Frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Build Frontend (Angular SSR)
        working-directory: Frontend
        run: npm run build

      # ── 5. Package deploy artifacts ───────────────────────────────────
      #
      #  node_modules is NOT included in the zip.
      #  setup.sh / setup.ps1 run "npm ci --omit=dev" on the target machine.
      #  Result: zip is ~15 MB instead of ~400 MB.
      #
      - name: Create deploy package
        run: |
          mkdir -p applyr-deploy/backend
          mkdir -p applyr-deploy/frontend
          mkdir -p applyr-deploy/logs

          # Backend: compiled JS + lockfile (deps installed on target by setup script)
          cp -r Backend/dist                applyr-deploy/backend/dist
          cp    Backend/package.json        applyr-deploy/backend/package.json
          cp    Backend/package-lock.json   applyr-deploy/backend/package-lock.json
          cp    Backend/.env.example        applyr-deploy/backend/.env.example

          # Frontend: Angular SSR build is fully self-contained, no node_modules needed
          cp -r Frontend/dist/Applyr        applyr-deploy/frontend/dist

          # PM2 config + setup scripts + docs
          cp ecosystem.config.cjs           applyr-deploy/
          cp README.md                      applyr-deploy/
          cp .github/scripts/setup.sh       applyr-deploy/setup.sh
          cp .github/scripts/setup.ps1      applyr-deploy/setup.ps1
          chmod +x applyr-deploy/setup.sh

          zip -r applyr-deploy.zip applyr-deploy/
          echo "Package size: $(du -sh applyr-deploy.zip | cut -f1)"

      # ── 6. Get version info ───────────────────────────────────────────
      - name: Get version info
        id: version
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # ── 7. Create GitHub Release ──────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}
          name: "Deploy Package — ${{ steps.version.outputs.date }}"
          body: |
            ## Applyr Deploy Package (~15 MB)

            Download `applyr-deploy.zip` — **no source code needed on the target machine**.
            `setup.sh` / `setup.ps1` handles everything: installs deps, PM2, and Puppeteer Chrome.

            ---

            ### Linux / macOS
            ```bash
            unzip applyr-deploy.zip
            cd applyr-deploy
            bash setup.sh
            nano backend/.env
            pm2 start ecosystem.config.cjs
            pm2 save && pm2 startup
            ```

            ### Windows (PowerShell)
            ```powershell
            Expand-Archive applyr-deploy.zip
            cd applyr-deploy
            powershell -ExecutionPolicy Bypass -File .\setup.ps1
            notepad backend\.env
            pm2 start ecosystem.config.cjs
            pm2 save
            pm2 startup
            ```

            ---

            ### What is inside the zip
            | Path | Description |
            |---|---|
            | `backend/dist/` | Compiled Express server |
            | `backend/package.json` + `package-lock.json` | Installed by setup script |
            | `backend/.env.example` | API key template |
            | `frontend/dist/` | Angular SSR build (self-contained) |
            | `ecosystem.config.cjs` | PM2 config (cross-platform) |
            | `setup.sh` | One-command setup for Mac/Linux |
            | `setup.ps1` | One-command setup for Windows |

            > `.env` is not included. The setup script creates it from `.env.example` automatically.

            **Commit:** `${{ steps.version.outputs.sha }}`
          files: applyr-deploy.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
